<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>🚀 Космос Оюну</title>
<style>
/* ===== style ===== */
:root{--bg:#070b1a;--cd:#111a38;--tx:#e8eeff;--mu:#8d9acb;--a:#5ee0ff;--b:#ff5ecb;--bd:#26356b}
body[data-t=light]{--bg:#e6ecff;--cd:#fff;--tx:#14204a;--mu:#5b6794;--bd:#b9c6f2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:"Trebuchet MS","Segoe UI",sans-serif;user-select:none}
body{background:radial-gradient(circle at 20% 0,#1b2a6b55,transparent 50%),radial-gradient(circle at 90% 100%,#6b1b5a44,transparent 45%),var(--bg)}
#app{max-width:520px;margin:0 auto;padding:12px;min-height:100vh}
.scr{display:none}.scr.on{display:block;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
h1{font-size:clamp(36px,10vw,54px);text-align:center;margin:26px 0 4px;letter-spacing:2px;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{text-align:center}.sub{text-align:center;color:var(--mu);margin:0 0 22px}
.b{display:block;width:100%;margin:10px 0;padding:15px;border:2px solid var(--bd);border-radius:14px;background:var(--cd);color:var(--tx);font:700 18px "Trebuchet MS",sans-serif;cursor:pointer;transition:.15s}
.b:hover{border-color:var(--a);box-shadow:0 0 16px #5ee0ff44;transform:translateY(-2px)}.b:active{transform:scale(.98)}
.b.main{background:linear-gradient(90deg,#1fa8d6,#c43aa0);border:0;color:#fff;font-size:21px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cd{background:var(--cd);border:2px solid var(--bd);border-radius:14px;padding:14px;text-align:center;cursor:pointer}
.cd.sel{border-color:var(--a);box-shadow:0 0 14px #5ee0ff55}.cd.lock{opacity:.6}.cd i{font-style:normal;font-size:38px}
.cd small{display:block;color:var(--mu);margin-top:4px}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 4px;border-bottom:1px solid var(--bd)}
#hud{display:flex;justify-content:space-between;background:var(--cd);border:2px solid var(--bd);border-radius:14px;padding:8px 10px;font-weight:700;font-size:14px;margin-bottom:8px;align-items:center}
#hud button{background:none;border:0;color:var(--tx);font-size:20px;cursor:pointer}
#wrap{position:relative;border:3px solid var(--bd);border-radius:14px;overflow:hidden;line-height:0;background:#000}
canvas{width:100%;max-height:72vh;object-fit:contain;display:block}
#ov{position:absolute;inset:0;display:none;place-items:center;text-align:center;line-height:1.3;background:#000b;color:#fff;padding:16px}
#ov.pop,#ov.over{display:grid}#ov.pop{pointer-events:none}
#ov>div{animation:zm .4s}#ov.pop>div{font-size:clamp(24px,7vw,38px);font-weight:900;text-shadow:0 0 20px var(--a)}
#ov h2{font-size:40px;margin:0 0 6px;color:#ff5a6e}#ov .b{margin:8px auto;max-width:280px}
@keyframes zm{from{transform:scale(.2) rotate(-8deg);opacity:0}}
#pad{display:none;justify-content:space-between;align-items:center;margin-top:10px}
#dp{display:grid;grid-template:repeat(2,58px)/repeat(3,58px);gap:6px}
#pad button{border-radius:16px;border:2px solid var(--bd);background:var(--cd);color:var(--tx);font-size:24px}
#pad button.on,#pad button:active{background:var(--a);color:#000}
#pad #fb{width:96px;height:96px;border-radius:50%;font-size:36px;border-color:var(--b)}
@media(hover:none),(max-width:700px){#pad{display:flex}}
#toast{position:fixed;top:12px;left:50%;transform:translate(-50%,-90px);background:linear-gradient(90deg,var(--a),var(--b));color:#06101f;padding:10px 18px;border-radius:30px;font-weight:700;transition:transform .35s;z-index:9;white-space:nowrap}
#toast.on{transform:translate(-50%,0)}
</style>
</head>
<body data-t="dark">
<div id="toast"></div>
<div id="app">
<section id="menu" class="scr on"></section>
<section id="ships" class="scr"><h2>🚀 Кемелер</h2><p class="sub" id="coinsLbl"></p><div id="sl" class="grid"></div><button class="b" onclick="go('menu')">← Артка</button></section>
<section id="sets" class="scr"><h2>⚙️ Настройкалар</h2><div id="stl"></div>
  <p style="color:var(--mu)">Башкаруу: ↑ ↓ ← → же WASD, ок: Space (кармап турсаңыз аткылай берет). Телефондо экрандагы кнопкалар.</p>
  <button class="b" onclick="go('menu')">← Артка</button></section>
<section id="ach" class="scr"><h2>🏆 Жетишкендиктер</h2><div id="al"></div><button class="b" onclick="go('menu')">← Артка</button></section>
<section id="game" class="scr">
  <div id="hud"><span>❤️<b id="hl">3</b></span><span>⭐<b id="hs">0</b></span><span>💎<b id="hc">0</b></span><span>🪙<b id="hm">0</b></span><span>🏆<b id="hv">1</b></span><button onclick="menu()">☰</button></div>
  <div id="wrap"><canvas id="cv" width="480" height="720"></canvas><div id="ov"></div></div>
  <div id="pad"><div id="dp"><span></span><button data-k="ArrowUp">↑</button><span></span><button data-k="ArrowLeft">←</button><button data-k="ArrowDown">↓</button><button data-k="ArrowRight">→</button></div><button id="fb" data-k="Space">🔥</button></div>
</section>
</div>

<script>
/* ===== script ===== */
const $=s=>document.querySelector(s),W=480,H=720,x=$('#cv').getContext('2d'),ov=$('#ov'),R=Math.random;
const SH=[
 {n:'Кичинекей кеме',i:'🛸',c:'#7dd3fc',w:14,sp:260,cd:.32,d:'Жеңил, ок жай',u:'Баштапкы'},
 {n:'Ылдам кеме',i:'🚀',c:'#fca5a5',w:18,sp:350,cd:.28,d:'Өтө ылдам',u:'150 монетага сатып ал'},
 {n:'Күчтүү кеме',i:'🔥',c:'#fdba74',w:24,sp:270,cd:.2,d:'Ок тез чыгат',u:'10-деңгээлге жет'},
 {n:'Супер кеме',i:'⚡',c:'#fde047',w:22,sp:350,cd:.16,d:'Ылдам жана күчтүү',u:'100 кристалл чогулт'},
 {n:'Alien Ship',i:'👽',c:'#86efac',w:26,sp:360,cd:.12,d:'Эң мыкты кеме',u:'Белектен түшөт'}];
const D={best:0,level:1,coins:0,cr:0,kills:0,gifts:0,dodged:0,ships:[0],ship:0,ach:[],set:{snd:1,mus:0,theme:'dark'}};
try{const s=JSON.parse(localStorage.getItem('kosmos_save')||'{}');Object.assign(D,s);D.set=Object.assign({snd:1,mus:0,theme:'dark'},s.set)}catch(e){}
const save=()=>{try{localStorage.setItem('kosmos_save',JSON.stringify(D))}catch(e){}};
const AC=[['c10','💎','10 кристалл чогулт',()=>D.cr>=10],['c100','💎','100 кристалл чогулт',()=>D.cr>=100],['l10','🚀','10-деңгээлге жет',()=>D.level>=10],['l50','🚀','50-деңгээлге жет',()=>D.level>=50],['l100','🏆','100-деңгээлге жет',()=>D.level>=100],['d50','☄️','50 метеориттен кач',()=>D.dodged>=50],['k100','👾','100 душманды жең',()=>D.kills>=100],['g10','🎁','10 белек ач',()=>D.gifts>=10]];
let G=null,raf,last=0,ST=[];
for(let i=0;i<90;i++)ST.push({x:R()*W,y:R()*H,z:1+(i%3)});

/* ---- UI ---- */
function go(id){document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id==id));
 if(id=='menu')rMenu();if(id=='ships')rShips();if(id=='sets')rSets();if(id=='ach')rAch()}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2400)}
function rMenu(){$('#menu').innerHTML=`<h1>COSMO</h1><p class="sub">Кристалл чогулт, метеориттен качып, чексиз космосту багында!</p>
 <button class="b main" onclick="start(${D.level})">${D.level>1?'▶ УЛАНТУУ — '+D.level+'-деңгээл':'🎮 ОЮНДУ БАШТОО'}</button>
 ${D.level>1?'<button class="b" onclick="start(1)">🆕 Жаңы оюн (1-деңгээл)</button>':''}
 <button class="b" onclick="go('ships')">🚀 КЕМЕЛЕР</button><button class="b" onclick="go('sets')">⚙️ НАСТРОЙКАЛАР</button><button class="b" onclick="go('ach')">🏆 ЖЕТИШКЕНДИКТЕР</button>`}
function rShips(){$('#coinsLbl').textContent='🪙 Монета: '+D.coins;
 $('#sl').innerHTML=SH.map((s,k)=>{const u=D.ships.includes(k);return `<div class="cd ${u?'':'lock'} ${D.ship==k?'sel':''}" onclick="pick(${k})"><i>${s.i}</i><br><b>${s.n}</b><small>${s.d}</small><small>${u?(D.ship==k?'✅ Тандалган':'Тандоо'):'🔒 '+s.u}</small></div>`}).join('')}
function pick(k){if(!D.ships.includes(k)){if(k==1&&D.coins>=150){D.coins-=150;unlockShip(1)}else return toast('🔒 '+SH[k].u)}
 D.ship=k;save();rShips()}
function unlockShip(k){if(D.ships.includes(k))return false;D.ships.push(k);toast('🎉 Жаңы кеме: '+SH[k].n);return true}
function rSets(){$('#stl').innerHTML=`<button class="b" onclick="tg('snd')">🔊 Үн: ${D.set.snd?'ON':'OFF'}</button><button class="b" onclick="tg('mus')">🎵 Музыка: ${D.set.mus?'ON':'OFF'}</button><button class="b" onclick="tg('theme')">${D.set.theme=='dark'?'🌙 Dark':'☀️ Light'} режим</button>`}
function tg(k){if(k=='theme')D.set.theme=D.set.theme=='dark'?'light':'dark';else D.set[k]=D.set[k]?0:1;theme();save();rSets()}
const theme=()=>document.body.dataset.t=D.set.theme;
function rAch(){$('#al').innerHTML=[['🏆 Эң жогорку упай',D.best],['🚀 Эң жогорку деңгээл',D.level],['💎 Чогултулган кристалл',D.cr],['👾 Жок кылынган душман',D.kills],['🎁 Алынган белек',D.gifts]].map(r=>`<div class="row"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')+'<br>'+
 AC.map(a=>`<div class="row" style="opacity:${D.ach.includes(a[0])?1:.45}"><span>${a[1]} ${a[2]}</span><span>${D.ach.includes(a[0])?'✅':'🔒'}</span></div>`).join('')}
function check(){if(G)D.best=Math.max(D.best,G.score);if(D.level>=10)unlockShip(2);if(D.cr>=100)unlockShip(3);
 AC.forEach(a=>{if(!D.ach.includes(a[0])&&a[3]()){D.ach.push(a[0]);toast('🏆 '+a[2])}});save()}

/* ---- Үн ---- */
let ac,mt,mi=0;const NT=[220,262,330,262,196,247,294,247];
function beep(f,d=.1,v=.08,ty='square',force){if(!D.set.snd&&!force)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
function music(){clearInterval(mt);if(D.set.mus)mt=setInterval(()=>beep(NT[mi++%8],.3,.04,'triangle',true),300)}

/* ---- Башкаруу ---- */
const K={};
addEventListener('keydown',e=>{K[e.code]=1;if(G&&(e.code=='Space'||e.code.startsWith('Arrow')))e.preventDefault()});
addEventListener('keyup',e=>K[e.code]=0);
document.querySelectorAll('#pad button').forEach(b=>{const k=b.dataset.k,on=e=>{e.preventDefault();K[k]=1;b.classList.add('on')},off=()=>{K[k]=0;b.classList.remove('on')};
 b.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,off))});

/* ---- Оюн ---- */
function start(l){G={l,score:0,lives:3,shield:false,spd:0,pow:0,slow:0,inv:0,shake:0,cd:0,state:'run',fx:[]};newLevel();ov.className='';ov.innerHTML='';go('game');last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);music()}
function menu(){if(G){check();G=null}cancelAnimationFrame(raf);clearInterval(mt);ov.className='';ov.innerHTML='';go('menu')}
function newLevel(){const l=G.l;D.level=Math.max(D.level,l);G.cr=0;G.need=Math.min(5+Math.floor(l/2),25);G.rocks=[];G.items=[];G.en=[];G.bul=[];G.eb=[];G.bars=[];G.traps=[];G.tm={rock:1,item:.5,en:3,bar:6,trap:8};G.ship={x:W/2,y:H-90};check()}
const sp=()=>Math.min(1+G.l*.04,3.2);
function loop(t){raf=requestAnimationFrame(loop);if(!G)return;const dt=Math.min((t-last)/1000,.05);last=t;if(G.state=='run')update(dt);draw(t);
 $('#hl').textContent=G.lives;$('#hs').textContent=G.score;$('#hc').textContent=G.cr+'/'+G.need;$('#hm').textContent=D.coins;$('#hv').textContent=G.l}
function update(dt){const g=G,l=g.l,s=g.ship,sh=SH[D.ship];
 ['inv','spd','pow','slow','shake','cd'].forEach(k=>g[k]=Math.max(0,g[k]-dt));
 const v=sh.sp*(g.spd>0?1.5:1)*(g.slow>0?.4:1)*dt;
 s.x+=((K.ArrowRight||K.KeyD?1:0)-(K.ArrowLeft||K.KeyA?1:0))*v;s.y+=((K.ArrowDown||K.KeyS?1:0)-(K.ArrowUp||K.KeyW?1:0))*v;
 s.x=Math.max(20,Math.min(W-20,s.x));s.y=Math.max(40,Math.min(H-30,s.y));
 if(K.Space&&g.cd<=0){g.cd=sh.cd*(g.pow>0?.8:1);(g.pow>0?[-.2,0,.2]:[0]).forEach(a=>g.bul.push({x:s.x,y:s.y-20,vx:Math.sin(a)*500,vy:-620,d:g.pow>0?2:1}));beep(900,.05,.04)}
 const k=sp(),T=g.tm;ST.forEach(a=>{a.y+=a.z*35*dt*k;if(a.y>H){a.y=0;a.x=R()*W}});
 if((T.rock-=dt)<=0){T.rock=Math.max(.28,1.1-l*.03);const r=R(),big=l>=20&&r<.15,fire=!big&&l>=5&&r<.45;
  g.rocks.push({x:30+R()*(W-60),y:-50,r:big?36:14+R()*12,vy:(90+R()*80)*k*(fire?1.4:1),vx:(R()-.5)*50,hp:big?4:1,t:big?'big':fire?'fire':'rock'})}
 if((T.item-=dt)<=0){T.item=.8+l*.02;const r=R();g.items.push({x:30+R()*(W-60),y:-20,vy:80*k,t:r<.55?'cr':r<.8?'star':'coin'})}
 if(l>=10&&(T.en-=dt)<=0){T.en=Math.max(1.2,4-l*.05);if(g.en.length<Math.min(1+Math.floor(l/15),5))g.en.push({x:R()*W,y:-30,hp:2+(l>=30?1:0),t:0,ph:R()*6,sh:1.5,f:l>=50})}
 if(l>=30&&(T.bar-=dt)<=0){T.bar=Math.max(5,9-l*.05);g.bars.push({y:-10,gx:80+R()*(W-160),gw:Math.max(110,150-l*.5)})}
 if(l>=15&&(T.trap-=dt)<=0){T.trap=8;g.traps.push({x:40+R()*(W-80),y:-30,r:22})}
 g.rocks.forEach(o=>{o.x+=o.vx*dt;o.y+=o.vy*dt});g.items.forEach(o=>o.y+=o.vy*dt);g.bars.forEach(o=>o.y+=90*k*dt);g.traps.forEach(o=>o.y+=70*dt);
 g.bul.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt});g.eb.forEach(b=>b.y+=b.vy*dt);
 g.en.forEach(e=>{e.t+=dt;e.y=Math.min(e.y+(e.f?110:60)*dt,110+Math.sin(e.t*2)*20);e.x=W/2+Math.sin(e.t*(e.f?2.4:1.2)+e.ph)*(W/2-40);
  if((e.sh-=dt)<=0){e.sh=e.f?.9:1.8;g.eb.push({x:e.x,y:e.y+20,vy:220+l*2})}});
 g.rocks=g.rocks.filter(o=>{if(o.y>H+50){D.dodged++;return false}return o.x>-60&&o.x<W+60});
 g.items=g.items.filter(o=>o.y<H+30);g.bars=g.bars.filter(o=>o.y<H+20);g.traps=g.traps.filter(o=>o.y<H+40);
 g.bul=g.bul.filter(b=>b.y>-20&&b.x>-10&&b.x<W+10);g.eb=g.eb.filter(b=>b.y<H+10);g.en=g.en.filter(e=>e.t<16);
 const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
 g.bul=g.bul.filter(b=>{for(const o of g.rocks)if(dist(b,o)<o.r+4){o.hp-=b.d;if(o.hp<=0){o.dead=1;g.score+=o.t=='big'?40:15;boom(o.x,o.y,o.t=='fire'?'#ff9a3c':'#b9a58f')}return false}
  for(const e of g.en)if(dist(b,e)<24){e.hp-=b.d;if(e.hp<=0){e.dead=1;D.kills++;g.score+=50;boom(e.x,e.y,'#c58bff',30);txt(e.x,e.y,'+50','#ffd84a');g.items.push({x:e.x,y:e.y,vy:80,t:'coin'});beep(200,.25,.1,'sawtooth')}return false}return true});
 g.rocks=g.rocks.filter(o=>!o.dead);g.en=g.en.filter(e=>!e.dead);
 for(const o of g.rocks)if(dist(o,s)<o.r+12){o.dead=1;boom(o.x,o.y,'#ff9a3c');hit()}
 g.rocks=g.rocks.filter(o=>!o.dead);
 for(const e of g.en)if(dist(e,s)<30){e.hp=0;e.dead=1;boom(e.x,e.y,'#c58bff');hit()}
 g.en=g.en.filter(e=>!e.dead);
 g.eb=g.eb.filter(b=>{if(dist(b,s)<16){hit();return false}return true});
 g.bars.forEach(b=>{if(Math.abs(s.y-b.y)<12&&(s.x<b.gx-b.gw/2||s.x>b.gx+b.gw/2))hit()});
 g.traps=g.traps.filter(o=>{if(dist(o,s)<o.r+14){g.slow=2.5;txt(s.x,s.y-30,'🌀 жайлады','#c58bff');beep(150,.3);return false}return true});
 g.items=g.items.filter(o=>{if(dist(o,s)<28){collect(o);return false}return true});
 g.fx.forEach(f=>{f.x+=f.vx*dt;f.y+=f.vy*dt;f.l-=dt*(f.tx?.8:1.6)});g.fx=g.fx.filter(f=>f.l>0)}
function boom(px,py,c,n=22){for(let i=0;i<n;i++){const a=R()*6.3,v=40+R()*220;G.fx.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c,s:2+R()*4})}beep(90,.25,.1,'sawtooth')}
function txt(px,py,tx,c){G.fx.push({x:px,y:py,vx:0,vy:-40,l:1,c,tx})}
function collect(o){const g=G;
 if(o.t=='cr'){g.cr++;D.cr++;g.score+=10;boom(o.x,o.y,'#5ee0ff',10);beep(880,.12,.08,'sine');if(R()<.15)bonus();check();if(g.cr>=g.need)win()}
 else if(o.t=='star'){g.score+=25;boom(o.x,o.y,'#ffd84a',10);beep(1100,.12,.08,'sine');bonus()}
 else{D.coins++;g.score+=5;txt(o.x,o.y,'+1🪙','#ffd84a');beep(1300,.06,.06,'sine')}}
function bonus(){const g=G,b=Math.floor(R()*4),s=g.ship;
 if(b==0){g.shield=true;txt(s.x,s.y-30,'🛡️ Калкан','#5ee0ff')}else if(b==1){g.spd=8;txt(s.x,s.y-30,'⚡ Ылдамдык','#ffd84a')}
 else if(b==2){g.pow=10;txt(s.x,s.y-30,'💥 Күчтүү ок','#ff8a5e')}else{D.coins+=5;txt(s.x,s.y-30,'+5🪙','#ffd84a')}}
function hit(){const g=G;if(g.inv>0)return;g.inv=1.5;g.shake=.4;beep(80,.4,.15,'sawtooth');boom(g.ship.x,g.ship.y,'#ff5a6e',30);
 if(g.shield){g.shield=false;return}if(--g.lives<=0)over()}
function win(){const g=G;g.state='pause';g.score+=50*g.l;g.rocks=[];g.en=[];g.eb=[];g.bars=[];g.traps=[];beep(1000,.4,.1,'triangle');
 banner('🎉 LEVEL COMPLETE!',1400,()=>{const f=()=>{G.l++;newLevel();G.state='run'};g.l%5==0?gift(f):f()})}
function gift(cb){const g=G,big=g.l%10==0,k=big?2:1;D.gifts++;
 const L=[()=>{D.coins+=30*k;return '🪙 +'+30*k+' монета'},()=>{g.lives++;return '❤️ Кошумча өмүр'},()=>{g.shield=true;return '🛡️ Калкан'},()=>{g.spd=15;return '⚡ Ылдамдык'},()=>{g.pow=20;return '💥 Күчтүү ок'}];
 if(!D.ships.includes(4)){const a=()=>{unlockShip(4);return '👽 Жаңы кеме: Alien Ship!'};L.push(a,a)}
 const r=L[Math.floor(R()*L.length)]();beep(520,.6,.12,'triangle');check();
 banner('🎁<br>YOU GOT A REWARD!<br><small>'+(big?'Чоң белек! ':'')+r+'</small>',2600,cb)}
function banner(h,ms,cb){ov.className='pop';ov.innerHTML='<div>'+h+'</div>';setTimeout(()=>{ov.className='';ov.innerHTML='';if(G&&cb)cb()},ms)}
function over(){const g=G;g.state='over';check();ov.className='over';
 ov.innerHTML=`<div><h2>💀 GAME OVER</h2><p>⭐ Упай: <b>${g.score}</b><br>🏆 Деңгээл: <b>${g.l}</b><br>💎 Кристалл: <b>${D.cr}</b></p><button class="b" onclick="start(1)">🔄 Кайра ойноо</button><button class="b" onclick="menu()">🏠 Башкы меню</button></div>`}

/* ---- Сүрөт ---- */
function draw(t){const g=G,sh=SH[D.ship],s=g.ship;x.save();x.fillStyle='#050816';x.fillRect(0,0,W,H);
 const gr=x.createRadialGradient(W*.7,H*.25,10,W*.7,H*.25,360);gr.addColorStop(0,'#3a1d6e55');gr.addColorStop(1,'#0000');x.fillStyle=gr;x.fillRect(0,0,W,H);
 ST.forEach(a=>{x.fillStyle='rgba(255,255,255,'+(.3+a.z*.2)+')';x.fillRect(a.x,a.y,a.z,a.z*(1+sp()*.8))});
 if(g.shake>0)x.translate((R()-.5)*14*g.shake*2,(R()-.5)*14*g.shake*2);
 x.textAlign='center';x.textBaseline='middle';
 g.traps.forEach(o=>{x.font='44px serif';x.save();x.translate(o.x,o.y);x.rotate(t/300);x.fillText('🌀',0,0);x.restore()});
 g.bars.forEach(b=>{x.strokeStyle='#8be9ff';x.shadowColor='#5ee0ff';x.shadowBlur=14;x.lineWidth=4;x.beginPath();x.moveTo(0,b.y);
  for(let i=0;i<=W;i+=12){if(i>b.gx-b.gw/2&&i<b.gx+b.gw/2){x.moveTo(i+12,b.y);continue}x.lineTo(i,b.y+(R()-.5)*14)}x.stroke();x.shadowBlur=0;x.font='22px serif';x.fillText('⚡',b.gx-b.gw/2-12,b.y);x.fillText('⚡',b.gx+b.gw/2+12,b.y)});
 g.items.forEach(o=>{const bob=Math.sin(t/160+o.x)*3;x.shadowColor=o.t=='cr'?'#5ee0ff':'#ffd84a';x.shadowBlur=16;x.font='28px serif';x.fillText(o.t=='cr'?'💎':o.t=='star'?'⭐':'🪙',o.x,o.y+bob);x.shadowBlur=0});
 g.rocks.forEach(o=>{x.save();x.translate(o.x,o.y);x.rotate(t/500*(o.vx>0?1:-1));if(o.t=='fire'){x.shadowColor='#ff7a1a';x.shadowBlur=20}x.font=o.r*2+'px serif';x.fillText(o.t=='fire'?'🔥':'☄️',0,0);x.restore()});
 g.en.forEach(e=>{x.font='40px serif';x.fillText('👾',e.x,e.y+Math.sin(t/150)*3)});
 x.fillStyle='#8be9ff';g.bul.forEach(b=>x.fillRect(b.x-2,b.y-8,4,14));x.fillStyle='#ff5a6e';g.eb.forEach(b=>{x.beginPath();x.arc(b.x,b.y,5,0,7);x.fill()});
 if(g.state!='over'){x.save();x.translate(s.x,s.y);if(g.inv>0&&((t/80|0)%2))x.globalAlpha=.35;
  x.shadowColor=sh.c;x.shadowBlur=18;x.fillStyle=sh.c;x.beginPath();x.moveTo(0,-26);x.lineTo(sh.w+4,16);x.lineTo(8,10);x.lineTo(-8,10);x.lineTo(-sh.w-4,16);x.closePath();x.fill();
  x.shadowBlur=0;x.fillStyle='#0b1220';x.beginPath();x.ellipse(0,-4,5,10,0,0,7);x.fill();
  x.fillStyle=g.spd>0?'#ffd84a':'#ff9a3c';x.beginPath();x.moveTo(-6,12);x.lineTo(6,12);x.lineTo(0,22+R()*10);x.fill();
  if(g.shield){x.strokeStyle='#5ee0ff';x.lineWidth=3;x.beginPath();x.arc(0,0,30,0,7);x.stroke()}
  if(g.slow>0){x.font='16px serif';x.fillText('🌀',0,-34)}x.restore()}
 g.fx.forEach(f=>{x.globalAlpha=Math.max(f.l,0);if(f.tx){x.fillStyle=f.c;x.font='bold 18px Trebuchet MS';x.fillText(f.tx,f.x,f.y)}else{x.fillStyle=f.c;x.fillRect(f.x,f.y,f.s,f.s)}});x.restore()}

theme();check();rMenu();
</script>
